
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation API</title>
</head>
<body>

    <h1>Geolocation API - lokalizacja na żywo</h1>

    <button id="start">Rozpocznij lokalizację</button>
    <button id="stop">Zatrzymaj lokalizację</button>

    <p id="status">Lokalizacja nieaktywna</p>

    <p>Szerokość geograficzna: <span id="latitude">---</span></p>
    <p>Długość geograficzna: <span id="longitude">---</span></p>
    <p>Dokładność: <span id="accuracy">---</span></p>

    <script src="./script.js"></script>

</body>
</html>
