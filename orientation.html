
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Orientation API</title>
</head>
<body>

    <h1>Device Orientation API</h1>

    <button id="start">Rozpocznij pomiar</button>
    <button id="stop">Zatrzymaj pomiar</button>

    <p id="status">Pomiar nieaktywny</p>

    <p>Alpha (obrót wokół osi Z):
        <span id="alpha">---</span>
    </p>

    <p>Beta (obrót wokół osi X):
        <span id="beta">---</span>
    </p>

    <p>Gamma (obrót wokół osi Y):
        <span id="gamma">---</span>
    </p>

    <script src="orientation.js"></script>

</body>
</html>
